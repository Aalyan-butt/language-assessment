    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Caslon+Display&display=swap');
    :root{--wine:#731f35;--wine2:#982e4c;--ink:#201c1d;--muted:#71696b;--line:#e8e1e2;--paper:#fff;--wash:#f7f3f3;--gold:#c6a15b;--green:#24744a;--red:#b52d3a;--shadow:0 24px 70px rgba(62,22,34,.12);--radius:24px;--serif:"Libre Caslon Display",Georgia,serif;--sans:"DM Sans",Inter,system-ui,sans-serif}

    .login{min-height:100vh;display:grid;grid-template-columns:minmax(480px,1.05fr) minmax(420px,.95fr);background:#fff}.login-art{position:relative;overflow:hidden;min-height:650px;padding:clamp(40px,6vw,82px);background:linear-gradient(150deg,#3c101f 0%,#731f35 58%,#9b3550 100%);color:#fff;display:flex;flex-direction:column;justify-content:space-between}.login-art:before{content:"";position:absolute;inset:-10%;background:radial-gradient(circle at 22% 18%,rgba(255,255,255,.15),transparent 27%),radial-gradient(circle at 85% 82%,rgba(198,161,91,.22),transparent 25%)}.login-art:after{content:"K";position:absolute;right:-2vw;bottom:-15vw;font:40vw/1 var(--serif);color:rgba(255,255,255,.035)}.login-art>*{position:relative;z-index:1}.login-mark{width:160px;padding:10px 15px;border-radius:12px;background:#fff;box-shadow:0 14px 35px rgba(0,0,0,.18)}.login-art h1{font:clamp(45px,5vw,78px)/.99 var(--serif);letter-spacing:-.035em;margin:30px 0 22px;max-width:700px}.login-art p{font-size:17px;line-height:1.7;color:#ead8dd;max-width:560px}.assurance{display:flex;gap:28px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.18);padding-top:24px}.assurance span{font-size:12px;color:#ebdfe2;display:flex;gap:9px;align-items:center}.assurance i{width:7px;height:7px;border-radius:50%;background:var(--gold)}.login-form-wrap{display:grid;place-items:center;padding:50px clamp(30px,7vw,100px);background:linear-gradient(145deg,#fff 55%,#f9f4f5)}.login-form{width:100%;max-width:430px}.kicker{color:var(--wine2);font-weight:700;font-size:11px;letter-spacing:.17em;text-transform:uppercase}.login-form h2,.page-title{font:46px/1.08 var(--serif);letter-spacing:-.025em;margin:12px 0}.lead{color:var(--muted);line-height:1.7;margin-bottom:32px}.label{display:flex;justify-content:space-between;font-weight:700;font-size:12px;margin:18px 0 8px}.field,textarea,select{width:100%;border:1px solid #ded5d7;background:#fff;color:var(--ink);border-radius:13px;padding:14px 15px;transition:.2s}.field:focus,te     .main{max-width:1180px;margin:0 auto;padding:44px 22px 90px}.hero{display:grid;grid-template-columns:1fr auto;align-items:end;gap:25px;margin:10px 0 34px}.hero .page-title{font-size:clamp(38px,5vw,60px);margin-bottom:10px}.hero p{color:var(--muted);max-width:660px;line-height:1.7;margin:0}.status-pill{padding:11px 15px;border-radius:999px;background:#e8f4ed;color:var(--green);font-size:12px;font-weight:700}.progress-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px 20px;display:flex;align-items:center;gap:18px;margin-bottom:24px;position:sticky;top:88px;z-index:20;box-shadow:0 10px 30px rgba(60,20,32,.06)}.progress-label{font-size:12px;font-weight:700;white-space:nowrap}.track{height:7px;flex:1;background:#eee8e9;border-radius:8px;overflow:hidden}.track i{height:100%;display:block;width:15%;background:linear-gradient(90deg,var(--gold),var(--wine2));transition:width .4s}.time-chip{font-variant-numeric:tabular-nums;color:var(--wine);font-weight:700;font-size:12px;white-space:nowrap}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px;align-items:start}.content{display:grid;gap:20px}.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:clamp(23px,4vw,38px);box-shadow:0 10px 35px rgba(62,22,34,.045)}.card-head{display:flex;gap:18px;align-items:flex-start;margin-bottom:24px}.number{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#f2e5e8;color:var(--wine);font-weight:800;flex:none}.card h2{font:29px/1.2 var(--serif);margin:0 0 7px}.card-sub{color:var(--muted);font-size:13px;line-height:1.55;margin:0}.details{display:grid;grid-template-columns:1fr 1fr;gap:14px}.detail{padding:16px;border-radius:14px;background:var(--wash)}.detail span{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.detail b{font-size:14px}.prompt{padding:20px 22px;border-radius:16px;background:linear-gradient(135deg,#faf5f6,#f6eff1);border-left:4px solid var(--wine     .speaking-list{display:grid;gap:18px}.speaking{border:1px solid var(--line);border-radius:18px;padding:22px}.q-title{display:flex;gap:13px;align-items:flex-start}.q-badge{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:var(--wine);color:#fff;font-size:11px;font-weight:800;flex:none}.q-title b{line-height:1.5}.record-area{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:17px}.record{min-width:116px}.record.recording{background:#fff0f1;color:var(--red);box-shadow:none}.rec-state{font-size:11px;color:var(--muted)}.rec-state.ready{color:var(--green);font-weight:700}.pulse{width:8px;height:8px;background:var(--red);border-radius:50%;display:inline-block;margin-right:6px;animation:pulse 1.1s infinite}@keyframes pulse{50%{opacity:.25}}audio{width:100%;height:42px;margin-top:14px}.transcript-toggle{border:0;background:transparent;color:var(--wine);font-size:11px;font-weight:700;padding:10px 0}.transcript{min-height:92px;resize:vertical;font-size:13px}.consent{display:flex;gap:11px;align-items:flex-start;margin:22px 0}.consent input{width:17px;height:17px;accent-color:var(--wine);margin-top:2px}.consent label{font-size:12px;color:#665d5f;line-height:1.55}.submit-row{display:flex;align-items:center;justify-content:space-between;gap:20px;border-top:1px solid var(--line);padding-top:24px}.submit-row p{font-size:11px;color:var(--muted);margin:0;max-width:480px}.side{display:grid;gap:18px;position:sticky;top:165px}.side-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:21px}.side-card h3{font:20px var(--serif);margin:0 0 13px}.checklist{list-style:none;margin:0;padding:0;display:grid;gap:12px}.checklist li{font-size:12px;color:#675e60;display:flex;gap:10px;line-height:1.45}.check{width:18px;height:18px;border-radius:50%;border:1px solid #d8cbce;display:grid;place-items:center;flex:none;color:#fff;font-size:10px}.check.done{background:var(--green);border-color:var(--green)}.help{background:linear-gradient(145deg,#43121f,#731f35);color:#fff;border:0}.help p{font-size:12px;color:#ead9de;line-height:1.6}.help .btn{background:#fff;color:var(--wine)}
    .modal{position:fixed;inset:0;background:rgba(24,13,17,.55);backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px;z-index:100}.modal-card{width:min(480px,100%);background:#fff;border-radius:24px;padding:32px;box-shadow:var(--shadow)}.modal-card h2{font:32px var(--serif);margin:8px 0}.success{text-align:center;max-width:680px;margin:8vh auto;background:#fff;border:1px solid var(--line);padding:clamp(35px,6vw,70px);border-radius:30px;box-shadow:var(--shadow)}.success-mark{width:72px;height:72px;margin:auto;border-radius:50%;background:#e5f3ea;color:var(--green);display:grid;place-items:center}.success h1{font:44px var(--serif);margin:24px 0 12px}.success p{color:var(--muted);line-height:1.7}.reference{margin:25px auto;padding:14px;border-radius:12px;background:var(--wash);font-size:12px}.toast{position:fixed;z-index:200;left:50%;bottom:25px;transform:translateX(-50%);background:#271d20;color:#fff;padding:13px 18px;border-radius:12px;box-shadow:var(--shadow);font-size:12px;max-width:90vw}.spinner{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .admin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:25px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}.stat b{font:34px var(--serif);display:block}.stat span{font-size:11px;color:var(--muted)}.admin-note{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:35px;margin-bottom:20px}.admin-note h2{font:30px var(--serif);margin-top:0}.table-wrap{overflow:auto;margin-top:18px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:13px 12px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}tbody tr:hover{background:#fbf8f8}.tag{display:inline-flex;padding:5px 9px;border-radius:999px;background:#f2e7ea;color:var(--wine);font-size:10px;font-weight:700}.tag.green{background:#e6f3eb;color:var(--green)}.report-modal{width:min(1000px,96vw);max-height:90vh;overflow:auto}.score-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:20px 0}.score{background:var(--wash);padding:15px;border-radius:13px}.score b{font:27px var(--serif);display:block}.score span{font-size:10px;color:var(--muted)}.answer-box{white-space:pre-wrap;line-height:1.7;border:1px solid var(--line);border-radius:13px;padding:16px;background:#fff}.mistakes td{white-space:normal;min-width:130px}.wrong{color:var(--red)}.right{color:var(--green);font-weight:700}
    .admin-tabs{display:inline-flex;padding:5px;background:#eee6e8;border-radius:14px;margin:4px 0 22px}.admin-tabs button{border:0;background:transparent;padding:11px 19px;border-radius:10px;color:#685d60;font-weight:700;font-size:12px}.admin-tabs button.active{background:#fff;color:var(--wine);box-shadow:0 5px 15px rgba(60,20,30,.08)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:15px}.actions{display:flex;gap:7px;flex-wrap:wrap}.feedback-list{background:#fff6df;border:1px solid #ead49d;border-radius:13px;padding:13px 30px;line-height:1.65}.audio-evidence{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.audio-evidence>div{padding:13px;background:var(--wash);border-radius:12px}.audio-evidence b{display:block;color:var(--wine)}.filters{display:grid;grid-template-columns:minmax(180px,1fr) 180px auto auto;gap:10px;margin:20px 0}.filters .field,.filters select{margin:0}.empty{padding:35px;text-align:center;color:var(--muted)}.override-box{margin-top:22px;padding:20px;border-radius:16px;background:#f7f2f3}.override-box textarea{min-height:100px;resize:vertical}
    @media(max-width:900px){.login{grid-template-columns:1fr}.login-art{min-height:390px}.login-art h1{font-size:50px}.login-form-wrap{min-height:620px}.layout{grid-template-columns:1fr}.side{position:static;grid-template-columns:1fr 1fr}.hero{grid-template-columns:1fr}.brand-copy,.brand-line{display:none}}
    @media(max-width:620px){.nav{height:66px;padding:0 15px}.brand img{width:100px}.user-meta{display:none}.main{padding:28px 14px 70px}.login-art{padding:32px 25px}.login-art h1{font-size:41px}.login-form-wrap{padding:45px 24px}.login-form h2{font-size:38px}.details,.side,.admin-grid,.score-row,.filters{grid-template-columns:1fr}.card{border-radius:19px;padding:22px 18px}.progress-card{top:76px}.progress-label{display:none}.submit-row{align-items:stretch;flex-direction:column}.submit-row .btn{width:100%}.record-area .btn{flex:1}.hero .page-title{font-size:40px}.speaking{padding:18px 15px}.section-head{align-items:flex-start;flex-direction:column}}

<body><div id="app" class="shell"></div><div id="toast" class="toast hidden" role="status"></div>
<script>
const API=(location.hostname==='127.0.0.1'||location.hostname==='localhost')?'':(window.KAPLAN_API_URL||'');
const app=document.querySelector('#app'),toastEl=document.querySelector('#toast');
const state={token:sessionStorage.getItem('kaplan_token')||'',csrf:sessionStorage.getItem('kaplan_csrf')||'',user:null,started:0,pastes:0,recorders:[null,null,null],audio:[null,null,null],audioMeta:[null,null,null],submitting:false,timer:null};
const icon=(name)=>({lock:'<svg class="icon" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>',mic:'<svg class="icon" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3M9 21h6"/></svg>',out:'<svg class="icon" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3M15 4h5v16h-5"/></svg>',check:'<svg class="icon" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>'})[name];
function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function toast(msg){toastEl.textContent=msg;toastEl.classList.remove('hidden');clearTimeout(toastEl.t);toastEl.t=setTimeout(()=>toastEl.classList.add('hidden'),4200)}
async function api(path,options={}){const headers={...(options.headers||{})};if(state.token)headers.Authorization='Bearer '+state.token;if(state.csrf&&options.method&&options.method!=='GET')headers['X-CSRF-Token']=state.csrf;if(options.json){headers['Content-Type']='application/json';options.body=JSON.stringify(options.json)}const r=await fetch(API+path,{...options,headers});let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(data.error?.message||'The service could not complete this request.');return data}
function saveSession(x){state.token=x.token;state.csrf=x.csrf_token;state.user=x.user;sessionStorage.setItem('kaplan_token',state.token);sessionStorage.setItem('kaplan_csrf',state.csrf)}
function clearSession(){sessionStorage.removeItem('kaplan_token');sessionStorage.removeItem('kaplan_csrf');state.token=state.csrf='';state.user=null}
function nav(){return `<header class="nav"><div class="brand"><img src="kaplan.png" alt="Kaplan"><i class="brand-line"></i><span class="brand-copy">English placement<br>assessment</span></div>${state.user?`<div class="userbar"><div class="user-meta"><b>${esc(state.user.name)}</b><span>${state.user.role==='admin'?'Administrator':'Student'}</span></div><div class="avatar">${esc(state.user.name[0]||'K')}</div><button class="btn btn-line" id="logout" aria-label="Log out">${icon('out')}<span class="desktop">Log out</span></button></div>`:''}</header>`}
function bindLogout(){document.querySelector('#logout')?.addEventListener('click',async()=>{try{await api('/api/v1/auth/logout',{method:'POST'})}catch{}clearSession();loginView()})}
function loginView(){clearInterval(state.timer);app.innerHTML=`<main class="login"><section class="login-art"><img class="login-mark" src="kaplan.png" alt="Kaplan"><div><div class="kicker" style="color:#dfbd79">English placement assessment</div><h1>Discover where your English can take you.</h1><p>A focused writing and speaking assessment designed to help your teachers place you at the right level.</p></div><div class="assurance"><span><i></i>Secure student access</span><span><i></i>About 15–20 minutes</span><span><i></i>Teacher-reviewed results</span></div></section><section class="login-form-wrap"><form class="login-form" id="loginForm"><div class="kicker">Welcome to Kaplan</div><h2>Sign in to continue</h2><p class="lead">Use the email address and temporary password provided by your administrator.</p><label class="label" for="email">Email address</label><input class="field" id="email" type="email" autocomplete="username" required maxlength="254" placeholder="name@example.com"><label class="label" for="password">Password</label><div class="password-wrap"><input class="field" id="password" type="password" autocomplete="current-password" required maxlength="128" placeholder="Enter your password"><button class="eye" type="button" id="eye" aria-label="Show password">◉</button></div><div class="form-error" id="loginError" role="alert"></div><button class="btn btn-primary wide" id="loginButton">Sign in securely</button><div class="security-note">${icon('lock')}<span>Your session is protected and will close after two hours of inactivity. Never share your password.</span></div></form></section></main>`;document.querySelector('#eye').onclick=()=>{const p=document.querySelector('#password');p.type=p.type==='password'?'text':'password'};document.querySelector('#loginForm').onsubmit=login}
async function login(e){e.preventDefault();const b=document.querySelector('#loginButton'),err=document.querySelector('#loginError');b.disabled=true;b.innerHTML='<i class="spinner"></i> Signing in';err.textContent='';try{const x=await api('/api/v1/auth/login',{method:'POST',json:{email:document.querySelector('#email').value,password:document.querySelector('#password').value}});saveSession(x);enter()}catch(ex){err.textContent=ex.message;b.disabled=false;b.textContent='Sign in securely'}}
function changePasswordView(){app.innerHTML=nav()+`<main class="main"><section class="success" style="text-align:left;max-width:540px"><div class="kicker">Account security</div><h1 style="font-size:38px">Create your private password</h1><p>Your administrator gave you a temporary password. Replace it before continuing.</p><form id="changeForm"><label class="label">Current temporary password</label><input class="field" id="current" type="password" required autocomplete="current-password"><label class="label">New password</label><input class="field" id="next" type="password" required minlength="10" autocomplete="new-password"><label class="label">Confirm new password</label><input class="field" id="confirm" type="password" required minlength="10" autocomplete="new-password"><div class="form-error" id="changeError"></div><button class="btn btn-primary wide">Save password and continue</button></form></section></main>`;bindLogout();document.querySelector('#changeForm').onsubmit=async e=>{e.preventDefault();const er=document.querySelector('#changeError'),next=document.querySelector('#next').value;if(next!==document.querySelector('#confirm').value){er.textContent='The new passwords do not match.';return}try{await api('/api/v1/auth/change-password',{method:'POST',json:{current_password:document.querySelector('#current').value,new_password:next}});state.user.must_change_password=false;toast('Your password has been updated.');enter()}catch(x){er.textContent=x.message}}}
function enter(){state.user.role==='student'?studentView():adminViewV3()}
function studentView(){state.started=Date.now();state.pastes=0;state.audio=[null,null,null];app.innerHTML=nav()+`<main class="main"><section class="hero"><div><div class="kicker">Kaplan English placement</div><h1 class="page-title">Your assessment</h1><p>Take your time and answer naturally. Your writing is checked automatically as a first pass, then reviewed by a teacher.</p></div><span class="status-pill">1 attempt available</span></section><div class="progress-card"><span class="progress-label" id="progressText">Getting started</span><div class="track"><i id="progressBar"></i></div><span class="time-chip" id="elapsed">00:00</span></div><div class="layout"><form class="content" id="testForm"><section class="card"><div class="card-head"><div class="number">01</div><div><h2>Confirm your details</h2><p class="card-sub">Please make sure this is your account before beginning.</p></div></div><div class="details"><div class="detail"><span>Student name</span><b>${esc(state.user.name)}</b></div><div class="detail"><span>Email address</span><b>${esc(state.user.email)}</b></div><div class="detail"><span>Assessment date</span><b>${new Intl.DateTimeFormat('en-GB',{dateStyle:'long'}).format(new Date())}</b></div><div class="detail"><span>Language standard</span><b>British English</b></div></div></section><section class="card"><div class="card-head"><div class="number">02</div><div><h2>Writing task</h2><p class="card-sub">Write in your own words. Aim for 120–180 words.</p></div></div><div class="prompt"><small>Your question</small><strong>Describe a memorable day in your life.</strong><p>Explain what happened, where you were, who was with you and why it was important. Try to describe events in the past.</p></div><label class="label" for="writing">Your answer</label><textarea id="writing" class="writing" maxlength="5000" required placeholder="Begin writing here…"></textarea><div class="counter"><span id="wordMessage">Aim for 120–180 words</span><span><b id="wordCount">0</b> words</span></div></section><section class="card"><div class="card-head"><div class="number">03</div><div><h2>Speaking tasks</h2><p class="card-sub">Record every answer. You can listen and record again before submitting.</p></div></div><div class="speaking-list">${speakingCard(0,'What did you do last weekend?')}${speakingCard(1,'Tell me about a time when you felt proud of yourself.')}${speakingCard(2,'Describe a place you visited and what you did there.')}</div><div class="consent"><input id="confirmWork" type="checkbox" required><label for="confirmWork">I confirm that these are my own answers and that I have listened to all three recordings.</label></div><div class="submit-row"><p>After submission, your answers cannot be changed unless an administrator allows another attempt.</p><button class="btn btn-primary" id="submitTest" type="submit" disabled>Submit assessment ${icon('check')}</button></div><div class="form-error" id="submitError"></div></section></form><aside class="side"><section class="side-card"><h3>Before you submit</h3><ul class="checklist"><li><i class="check" id="c-writing">✓</i><span>Writing contains at least 20 words</span></li><li><i class="check" id="c-audio">✓</i><span>All three recordings are ready</span></li><li><i class="check" id="c-confirm">✓</i><span>Declaration is confirmed</span></li></ul></section><section class="side-card help"><h3>A calm space helps</h3><p>Use headphones if possible, speak clearly and keep the microphone close. Each answer can be up to 90 seconds.</p><button class="btn" type="button" id="micCheck">Check microphone</button></section></aside></div></main>`;bindLogout();bindTest();startClock()}
function speakingCard(i,q){return `<article class="speaking"><div class="q-title"><span class="q-badge">${i+1}</span><b>${esc(q)}</b></div><div class="record-area"><button class="btn btn-soft record" type="button" id="record${i}" data-i="${i}">${icon('mic')} Record answer</button><span class="rec-state" id="state${i}">Not recorded · maximum 90 seconds</span></div><audio class="hidden" id="audio${i}" controls preload="metadata"></audio><button class="transcript-toggle" type="button" data-transcript="${i}">+ Add an optional typed transcript</button><textarea class="transcript hidden" id="transcript${i}" maxlength="3000" placeholder="Optional transcript of your spoken answer…"></textarea></article>`}
function bindTest(){const w=document.querySelector('#writing'),confirm=document.querySelector('#confirmWork');w.addEventListener('paste',()=>state.pastes++);w.addEventListener('input',updateReady);confirm.addEventListener('change',updateReady);document.querySelectorAll('[data-transcript]').forEach(b=>b.onclick=()=>{const t=document.querySelector('#transcript'+b.dataset.transcript);t.classList.toggle('hidden');b.textContent=t.classList.contains('hidden')?'+ Add an optional typed transcript':'− Hide typed transcript'});document.querySelectorAll('.record').forEach(b=>b.onclick=()=>toggleRecording(+b.dataset.i));document.querySelector('#micCheck').onclick=async()=>{try{const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop());toast('Microphone access is working.')}catch{toast('Microphone access was not granted. Check browser permissions.')}};document.querySelector('#testForm').onsubmit=submitTest;updateReady()}
function startClock(){clearInterval(state.timer);state.timer=setInterval(()=>{const s=Math.floor((Date.now()-state.started)/1000),m=String(Math.floor(s/60)).padStart(2,'0'),r=String(s%60).padStart(2,'0');const el=document.querySelector('#elapsed');if(el)el.textContent=m+':'+r},1000)}
function updateReady(){const words=(document.querySelector('#writing')?.value.trim().match(/\b[\p{L}\p{N}’'-]+\b/gu)||[]).length;document.querySelector('#wordCount').textContent=words;const msg=document.querySelector('#wordMessage');msg.textContent=words<120?`${120-words} more to reach the target`:words<=180?'Within the recommended range':`${words-180} over the recommended range`;msg.className=words>=120&&words<=180?'good':'';const writing=words>=20,audio=state.audio.every(Boolean),confirmed=document.querySelector('#confirmWork').checked;document.querySelector('#c-writing').classList.toggle('done',writing);document.querySelector('#c-audio').classList.toggle('done',audio);document.querySelector('#c-confirm').classList.toggle('done',confirmed);document.querySelector('#submitTest').disabled=!(writing&&audio&&confirmed)||state.submitting;const done=[writing,audio,confirmed].filter(Boolean).length;document.querySelector('#progressBar').style.width=(15+done*28)+'%';document.querySelector('#progressText').textContent=done===3?'Ready to submit':done===0?'Getting started':`${done} of 3 requirements ready`}
async function toggleRecording(i){if(state.recorders[i])return stopRecording(i);if(state.recorders.some(Boolean)){toast('Stop the current recording first.');return}if(!window.lamejs){toast('The MP3 encoder is still loading. Please wait a moment.');return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,channelCount:1}}),ctx=new(window.AudioContext||window.webkitAudioContext)(),source=ctx.createMediaStreamSource(stream),processor=ctx.createScriptProcessor(4096,1,1),silent=ctx.createGain(),chunks=[];silent.gain.value=0;processor.onaudioprocess=e=>chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));source.connect(processor);processor.connect(silent);silent.connect(ctx.destination);const rec={stream,ctx,source,processor,silent,chunks,started:Date.now(),timeout:null};rec.timeout=setTimeout(()=>stopRecording(i),90000);state.recorders[i]=rec;const b=document.querySelector('#record'+i),s=document.querySelector('#state'+i);b.className='btn record recording';b.innerHTML='<span class="pulse"></span> Stop recording';const tick=()=>{if(state.recorders[i]){s.innerHTML=`<span class="pulse"></span> Recording · ${Math.min(90,Math.floor((Date.now()-rec.started)/1000))} seconds`;rec.tick=requestAnimationFrame(tick)}};tick()}catch(e){toast('Microphone access is required. Allow it in your browser settings.') }}
function stopRecording(i){const r=state.recorders[i];if(!r)return;clearTimeout(r.timeout);cancelAnimationFrame(r.tick);r.processor.disconnect();r.source.disconnect();r.silent.disconnect();r.stream.getTracks().forEach(t=>t.stop());const rate=r.ctx.sampleRate;r.ctx.close();state.recorders[i]=null;const length=r.chunks.reduce((n,x)=>n+x.length,0),pcm=new Float32Array(length);let at=0;r.chunks.forEach(x=>{pcm.set(x,at);at+=x.length});const mp3=encodeMp3(pcm,rate),blob=new Blob(mp3,{type:'audio/mpeg'});state.audio[i]=blob;state.audioMeta[i]=measureAudio(pcm,rate);const url=URL.createObjectURL(blob),player=document.querySelector('#audio'+i);if(player.src)URL.revokeObjectURL(player.src);player.src=url;player.classList.remove('hidden');const b=document.querySelector('#record'+i),s=document.querySelector('#state'+i);b.className='btn btn-line record';b.innerHTML=icon('mic')+' Record again';s.textContent=`Ready · ${state.audioMeta[i].duration.toFixed(0)} sec · ${Math.round(blob.size/1024)} KB MP3`;s.className='rec-state ready';updateReady()}
function measureAudio(pcm,rate){let sum=0,clipped=0,silent=0,windows=0;const size=Math.max(1,Math.round(rate*.02));for(let start=0;start<pcm.length;start+=size){let local=0,n=0;for(let j=start;j<Math.min(start+size,pcm.length);j++){const v=pcm[j];sum+=v*v;local+=v*v;n++;if(Math.abs(v)>=.98)clipped++}if(n){windows++;if(Math.sqrt(local/n)<.015)silent++}}return{duration:pcm.length/rate,rms:Math.sqrt(sum/Math.max(1,pcm.length)),silence_ratio:silent/Math.max(1,windows),clipping_ratio:clipped/Math.max(1,pcm.length)}}
function encodeMp3(pcm,rate){const enc=new lamejs.Mp3Encoder(1,rate,96),out=[],block=1152;for(let i=0;i<pcm.length;i+=block){const end=Math.min(i+block,pcm.length),samples=new Int16Array(end-i);for(let j=i;j<end;j++){const v=Math.max(-1,Math.min(1,pcm[j]));samples[j-i]=v<0?v*32768:v*32767}const buf=enc.encodeBuffer(samples);if(buf.length)out.push(new Int8Array(buf))}const last=enc.flush();if(last.length)out.push(new Int8Array(last));return out}
async function submitTest(e){e.preventDefault();if(state.submitting)return;state.submitting=true;updateReady();const b=document.querySelector('#submitTest'),err=document.querySelector('#submitError'),steps=['Uploading recordings…','Checking your answers…','Creating your private report…','Saving your results…'];let step=0;b.innerHTML='<i class="spinner"></i> '+steps[0];const progress=setInterval(()=>{step=Math.min(step+1,steps.length-1);b.innerHTML='<i class="spinner"></i> '+steps[step]},3500);err.textContent='';const id=crypto.randomUUID(),fd=new FormData();fd.set('submission_id',id);fd.set('started_at',new Date(state.started).toISOString());fd.set('time_seconds',Math.max(1,Math.round((Date.now()-state.started)/1000)));fd.set('paste_flag',state.pastes>0);fd.set('paste_events',state.pastes);fd.set('writing_answer',document.querySelector('#writing').value);fd.set('speaking_metrics',JSON.stringify(state.audioMeta));for(let i=0;i<3;i++){fd.set('speaking_transcript_'+(i+1),document.querySelector('#transcript'+i).value);fd.set('audio_'+(i+1),state.audio[i],`answer-${i+1}.mp3`)}try{const x=await api('/api/v1/student/submissions',{method:'POST',body:fd});clearInterval(progress);clearInterval(state.timer);successView(x.submission_id)}catch(ex){clearInterval(progress);state.submitting=false;err.textContent=ex.message;b.textContent='Submit assessment';updateReady()}}

async function openReport(id){try{const x=await api('/api/v1/admin/results/'+encodeURIComponent(id),{method:'GET',headers:{'X-CSRF-Token':state.csrf}}),r=x.result,w=x.report.writing||{},scores=w.scores||{};const modal=document.createElement('div');modal.className='modal';modal.innerHTML=`<section class="modal-card report-modal"><button class="btn btn-line" style="float:right" id="closeReport">Close</button><div class="kicker">Automated first-pass report</div><h2>${esc(r.name)}</h2><p class="lead">${esc(r.email)} · ${esc((r.submitted_at||'').replace('T',' ').slice(0,19))}</p><div class="score-row"><div class="score"><b>${esc(w.total||r.total_score)}/20</b><span>Total</span></div><div class="score"><b>${esc(w.level||r.suggested_level)}</b><span>Suggested level</span></div><div class="score"><b>${esc(scores.grammar||r.grammar_score)}/5</b><span>Grammar</span></div><div class="score"><b>${esc(scores.spelling_punctuation||r.spelling_punctuation_score)}/5</b><span>Spelling & punctuation</span></div><div class="score"><b>${esc(scores.vocabulary||r.vocabulary_score)}/5</b><span>Vocabulary</span></div></div><h3>Original writing answer</h3><div class="answer-box">${esc(r.writing_answer)}</div><h3>Speaking transcripts</h3>${[1,2,3].map(n=>`<p><b>Answer ${n}</b><br>${esc(r['speaking_transcript_'+n]||'No transcript typed.')}</p>`).join('')}<h3>Mistakes and corrections</h3><div class="table-wrap"><table class="mistakes"><thead><tr><th>Section</th><th>Category</th><th>Original</th><th>Correction</th><th>Explanation</th></tr></thead><tbody>${x.errors.map(e=>`<tr><td>${esc(e.answer_section)}</td><td><span class="tag">${esc(e.category)}</span></td><td class="wrong">${esc(e.original_text)}</td><td class="right">${esc(e.suggested_correction||'—')}</td><td>${esc(e.explanation)}</td></tr>`).join('')||'<tr><td colspan="5">No issues found.</td></tr>'}</tbody></table></div><div class="security-note">${icon('lock')}<span>${esc(w.notice||'Automated first-pass check—teacher to confirm.')}</spa function accountModal(user=null){const modal=document.createElement('div');modal.className='modal';modal.innerHTML=`<form class="modal-card" id="accountForm"><div class="kicker">${user?'Update access':'New access'}</div><h2>${user?'Edit account':'Create account'}</h2><label class="label">Full name</label><input class="field" id="accountName" required maxlength="100" value="${esc(user?.name||'')}"><label class="label">Email address</label><input class="field" id="accountEmail" type="email" required value="${esc(user?.email||'')}"><label class="label">Role</label><select id="accountRole"><option value="student" ${user?.role==='student'?'selected':''}>Student</option><option value="admin" ${user?.role==='admin'?'selected':''}>Administrator</option></select><label class="label">${user?'New password (leave blank to keep current)':'Password'}</label><input class="field" id="accountPassword" type="password" ${user?'':'required'} minlength="10" autocomplete="new-password"><label class="label">Attempts allowed</label><input class="field" id="accountAttempts" type="number" min="1" max="20" value="${user?.attempts_allowed||1}"><div class="form-error" id="accountError"></div><div class="actions"><button class="btn btn-primary" type="submit">${user?'Save changes':'Create account'}</button><button class="btn btn-line" type="button" id="cancelAccount">Cancel</button></div></form>`;document.body.appendChild(modal);modal.querySelector('#cancelAccount').onclick=()=>modal.remove();modal.querySelector('#accountForm').onsubmit=async e=>{e.preventDefault();const err=modal.querySelector('#accountError'),name=modal.querySelector('#accountName').value,email=modal.querySelector('#accountEmail').value,role=modal.querySelector('#accountRole').value,password=modal.querySelector('#accountPassword').value,attempts=+modal.querySelector('#accountAttempts').value;try{if(user){await api('/api/v1/admin/users/'+user.user_id,{method:'PATCH',json:{name,email,role}});if(password)await api('/api/v1/admin/u function correctedView(text,issues){let out='',pos=0;[...(issues||[])].sort((a,b)=>a.start-b.start).forEach(i=>{if(i.start<pos||i.start>text.length)return;out+=esc(text.slice(pos,i.start));if(i.original==='end of answer'){out+=`<ins class="right">${esc(i.correction)}</ins>`;pos=i.start;return}out+=`<del class="wrong">${esc(text.slice(i.start,i.end))}</del>`+(i.correction?` <ins class="right">${esc(i.correction)}</ins>`:'');pos=i.end});return out+esc(text.slice(pos))}

async function openReport(id){try{const x=await api('/api/v1/admin/results/'+encodeURIComponent(id),{method:'GET',headers:{'X-CSRF-Token':state.csrf}}),r=x.result,w=x.report.writing||{},scores=w.scores||{},speak=w.speaking_recording||{answers:[]};const modal=document.createElement('div');modal.className='modal';modal.innerHTML=`<section class="modal-card report-modal"><button class="btn btn-line" style="float:right" id="closeReport">Close</button><div class="kicker">Automated first-pass report</div><h2>${esc(r.name)}</h2><p class="lead">${esc(r.email)} · ${esc((r.submitted_at||'').replace('T',' ').slice(0,19))}</p><div class="score-row"><div class="score"><b>${esc(w.total||r.total_score)}/20</b><span>Writing total</span></div><div class="score"><b>${esc(w.level||r.suggested_level)}</b><span>Suggested placement</span></div><div class="score"><b>${esc(scores.grammar||r.grammar_score)}/5</b><span>Grammar</span></div><div class="score"><b>${esc(scores.spelling_punctuation||r.spelling_punctuation_score)}/5</b><span>Spelling & punctuation</span></div><div class="score"><b>${esc(scores.vocabulary||r.vocabulary_score)}/5</b><span>Vocabulary</span></div><div class="score"><b>${esc(scores.task_length||r.task_length_score)}/5</b><span>Task & length</span></div></div><h3>Task-completion feedback</h3><ul class="feedback-list">${(w.task_feedback||[]).map(f=>`<li>${esc(f)}</li>`).join('')}</ul><h3>Original writing answer</h3><div class="answer-box">${esc(r.writing_answer)}</div><h3>Corrected writing view</h3><div class="answer-box">${correctedView(r.writing_answer,w.issues||[])}</div><h3>Speaking recording evidence</h3><p class="security-note">This measures recording length, audibility, pauses and clipping only. A teacher must judge pronunciation, word accuracy, fluency and relevance.</p><div class="audio-evidence">${[0,1,2].map(i=>{const a=speak.answers?.[i]||{};return`<div><b>Answer ${i+1}: ${esc(a.automated_recording_score||'—')}/5</b><span>${esc(a.duration_seconds||'—')} seconds</span><p>${esc((a.feedback||[]).join(' ')||'Teacher review required.')}</p>${r['audio_'+(i+1)+'_url']?`<a class="btn btn-soft" target="_blank" rel="noopener" href="${esc(r['audio_'+(i+1)+'_url'])}">Play recording</a>`:''}<p><strong>Typed transcript:</strong><br>${esc(r['speaking_transcript_'+(i+1)]||'Not supplied. The teacher must listen to assess spoken language.')}</p></div>`}).join('')}</div><h3>Mistakes and corrections</h3><div class="table-wrap"><table class="mistakes"><thead><tr><th>Section</th><th>Category</th><th>Original</th><th>Correction</th><th>Explanation</th></tr></thead><tbody>${x.errors.map(e=>`<tr><td>${esc(e.answer_section)}</td><td><span class="tag">${esc(e.category)}</span></td><td class="wrong">${esc(e.original_text)}</td><td class="right">${esc(e.suggested_correction||'—')}</td><td>${esc(e.explanation)}</td></tr>`).join('')||'<tr><td colspan="5">No rule-based issues found.</td></tr>'}</tbody></table></div><h3>Personal learning guidelines</h3>${(w.lessons||[]).map(l=>`<div class="prompt"><small>${esc(l.category)}</small><strong>${esc(l.title)}</strong><p>${esc(l.rule)}<br><b>Examples:</b> ${esc(l.examples)}<br><b>Common mistake:</b> ${esc(l.mistake)}<br><b>Student example:</b> ${esc(l.student_example?.original||'')} → ${esc(l.student_example?.correction||'review')}</p></div>`).join('')||'<p>No specific lessons selected.</p>'}<div class="actions">${r.doc_url?`<a class="btn btn-primary" target="_blank" rel="noopener" href="${esc(r.doc_url)}">Open Google Doc</a>`:''}${r.audio_folder_url?`<a class="btn btn-line" target="_blank" rel="noopener" href="${esc(r.audio_folder_url)}">Open audio folder</a>`:''}</div><div class="security-note">${icon('lock')}<span>${esc(w.notice||'Automated first-pass check—teacher to confirm.')}</span></div></section>`;document.body.appendChild(modal);modal.querySelector('#closeReport').onclick=()=>modal.remove();modal.onclick=e=>{if(e.target===modal)modal.remove()}}catch(e){toast(e.message)}}
async function adminViewV3(){app.innerHTML=nav()+`<main class="main"><section class="hero"><div><div class="kicker">Administration</div><h1 class="page-title">Assessment centre</h1><p>Search responses, confirm placements and manage authorised accounts.</p></div><span class="status-pill">Secure administrator session</span></section><div class="admin-grid"><div class="stat"><b id="allUsers">—</b><span>Total accounts</span></div><div class="stat"><b id="students">—</b><span>Students</span></div><div class="stat"><b id="submissions">—</b><span>Submissions</span></div></div><nav class="admin-tabs"><button class="active" data-tab="responses">Student responses</button><button data-tab="accounts">Accounts</button></nav><section id="adminPane"><div class="admin-note">Loading secure data…</div></section></main>`;bindLogout();document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));drawAdminPaneV3(b.dataset.tab)});try{const headers={'X-CSRF-Token':state.csrf},[users,results]=await Promise.all([api('/api/v1/admin/users',{method:'GET',headers}),api('/api/v1/admin/results',{method:'GET',headers})]);state.adminUsers=users.users;state.adminResults=results.results;document.querySelector('#allUsers').textContent=users.users.length;document.querySelector('#students').textContent=users.users.filter(x=>x.role==='student').length;document.querySelector('#submissions').textContent=results.results.length;drawAdminPaneV3('responses')}catch(e){document.querySelector('#adminPane').innerHTML=`<div class="admin-note"><p class="form-error">${esc(e.message)}</p></div>`}}
function drawAdminPaneV3(tab){const pane=document.querySelector('#adminPane');if(tab==='responses'){pane.innerHTML=`<section class="admin-note"><div class="section-head"><div><div class="kicker">Student responses</div><h2>Placement results</h2></div></div><div class="filters"><input class="field" id="resultSearch" placeholder="Search name or email"><select id="levelFilter"><option value="">All levels</option><option>Teacher review required</option><option>Below A2</option><option>A2</option><option>B1</option><option>B2</option></select><button class="btn btn-line" id="printResults">Print list</button><button class="btn btn-primary" id="exportResults">Export CSV</button></div><div class="table-wrap"><table><thead><tr><th>Student</th><th>Submitted</th><th>Words</th><th>Writing</th><th>Speaking evidence</th><th>Placement</th><th></th></tr></thead><tbody id="filteredResults"></tbody></table></div></section>`;const render=()=>{const q=document.querySelector('#resultSearch').value.toLowerCase(),level=document.querySelector('#levelFilter').value,rows=state.adminResults.filter(r=>(!q||(r.name+' '+r.email).toLowerCase().includes(q))&&(!level||(r.teacher_level||r.suggested_level)===level));document.querySelector('#filteredResults').innerHTML=rows.map(r=>`<tr><td><b>${esc(r.name)}</b><br><span style="color:var(--muted)">${esc(r.email)}</span></td><td>${esc((r.submitted_at||'').slice(0,16).replace('T',' '))}</td><td>${esc(r.word_count)}</td><td><b>${esc(r.total_score)}/20</b></td><td>${esc(r.speaking_auto_score||'—')}/5</td><td><span class="tag ${(r.teacher_level||r.suggested_level)==='Teacher review required'?'':'green'}">${esc(r.teacher_level||r.suggested_level)}</span></td><td><button class="btn btn-soft" data-managed-report="${esc(r.submission_id)}">Open report</button></td></tr>`).join('')||'<tr><td class="empty" colspan="7">No matching submissions.</td></tr>';document.querySelectorAll('[data-managed-report]').forEach(b=>b.onclick=()=>openManagedReport(b.dataset.managedReport))};document.querySelector('#resultSearch').oninput=render;document.querySelector('#levelFilter').onchange=render;document.querySelector('#exportResults').onclick=exportResults;document.querySelector('#printResults').onclick=()=>printResultList(state.adminResults);render();return}pane.innerHTML=`<section class="admin-note"><div class="section-head"><div><div class="kicker">Access management</div><h2>Accounts</h2></div><div class="actions"><button class="btn btn-line" id="bulkAccounts">Bulk import</button><button class="btn btn-primary" id="createAccount">Create account</button></div></div><div class="filters" style="grid-template-columns:1fr 180px"><input class="field" id="accountSearch" placeholder="Search accounts"><select id="roleFilter"><option value="">All roles</option><option value="student">Students</option><option value="admin">Administrators</option></select></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Attempts</th><th>Password</th><th></th></tr></thead><tbody id="filteredAccounts"></tbody></table></div></section>`;const renderAccounts=()=>{const q=document.querySelector('#accountSearch').value.toLowerCase(),role=document.querySelector('#roleFilter').value,users=state.adminUsers.filter(u=>(!q||(u.name+' '+u.email).toLowerCase().includes(q))&&(!role||u.role===role));document.querySelector('#filteredAccounts').innerHTML=users.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.email)}</td><td><span class="tag">${esc(u.role)}</span></td><td><span class="tag ${u.status==='active'?'green':''}">${esc(u.status)}</span></td><td>${u.attempts_used}/${u.attempts_allowed}</td><td>${esc(u.password_status)}</td><td><div class="actions"><button class="btn btn-soft" data-edit-user="${u.user_id}">Edit</button><button class="btn btn-line" data-status-user="${u.user_id}">${u.status==='active'?'Disable':'Enable'}</button></div></td></tr>`).join('')||'<tr><td class="empty" colspan="7">No matching accounts.</td></tr>';document.querySelectorAll('[data-edit-user]').forEach(b=>b.onclick=()=>accountModal(state.adminUsers.find(u=>u.user_id===b.dataset.editUser)));document.querySelectorAll('[data-status-user]').forEach(b=>b.onclick=()=>toggleAccount(b.dataset.statusUser))};document.querySelector('#accountSearch').oninput=renderAccounts;document.querySelector('#roleFilter').onchange=renderAccounts;document.querySelector('#createAccount').onclick=()=>accountModal();document.querySelector('#bulkAccounts').onclick=bulkAccountModal;renderAccounts()}

async function openManagedReport(id){const detail=await api('/api/v1/admin/results/'+encodeURIComponent(id),{method:'GET',headers:{'X-CSRF-Token':state.csrf}});await openReport(id);const modals=document.querySelectorAll('.modal'),modal=modals[modals.length-1],card=modal?.querySelector('.report-modal');if(!card)return;const box=document.createElement('section');box.className='override-box';box.innerHTML=`<h3>Teacher decision</h3><label class="label">Final placement level</label><select id="teacherLevel"><option value="">Not confirmed</option><option>Below A2</option><option>A2</option><option>B1</option><option>B2</option><option>Teacher review required</option></select><label class="label">Teacher notes</label><textarea id="teacherNotes" maxlength="5000" placeholder="Add manual speaking assessment, placement reasoning and recommendations."></textarea><div class="actions"><button class="btn btn-primary" id="saveOverride">Save teacher decision</button><button class="btn btn-line" id="printReport">Print report</button></div>`;card.appendChild(box);box.querySelector('#teacherLevel').value=detail.result.teacher_level||'';box.querySelector('#teacherNotes').value=detail.result.teacher_notes||'';box.querySelector('#printReport').onclick=()=>window.print();box.querySelector('#saveOverride').onclick=async()=>{try{await api('/api/v1/admin/results/'+encodeURIComponent(id)+'/override',{method:'PATCH',json:{teacher_level:box.querySelector('#teacherLevel').value,teacher_notes:box.querySelector('#teacherNotes').value}});toast('Teacher decision saved.');modal.remove();adminViewV3()}catch(e){toast(e.message)}}}
